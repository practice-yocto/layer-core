# Use the systemd-core configuration as the base distro settings.
require conf/distro/systemd-core.conf

# Define the SELinux-enabled distribution identity.
DISTRO ?= "selinux-core"
DISTRO_NAME ?= "SELinux Core (SELinux Core Distro)"
DISTRO_VERSION ?= "1.0.0"

# Enable SELinux user-space support and select the default reference policy.
DISTRO_FEATURES:append = " acl xattr pam selinux"
PREFERRED_PROVIDER_virtual/refpolicy = "refpolicy-mls"
IMAGE_CLASSES += "selinux-image"

# Disable the default syslog implementation provided by base-utils.
# Prevent busybox-syslog from being recommended to avoid conflicts with
# the intended logging setup in this SELinux-based distribution.
VIRTUAL-RUNTIME_base-utils-syslog = ""
BAD_RECOMMENDATIONS += "busybox-syslog"