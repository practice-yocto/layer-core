# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Optionally use an external kernel, if set to 1, include the bbappend for the kernel recipe
USE_EXTERNAL_KERNEL ?= "0"
BBFILES += "${@ '${LAYERDIR}/appends/linux/linux-core.bbappend' if d.getVar('USE_EXTERNAL_KERNEL') == '1' else '' }"

# Optionally use an external module, if set to 1, include the bbappend for the module recipe
USE_EXTERNAL_MODULE ?= "0"
BBFILES += "${@ '${LAYERDIR}/appends/hello-kmodule/hello-kmodule.bbappend' if d.getVar('USE_EXTERNAL_MODULE') == '1' else '' }"

BBFILE_COLLECTIONS += "meta-core-bsp"
BBFILE_PATTERN_meta-core-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-core-bsp = "6"

LAYERDEPENDS_meta-core-bsp = "core"
LAYERSERIES_COMPAT_meta-core-bsp = "scarthgap"
