# -----------------------------------------------------------------------------
# Include the base machine configuration
# This pulls in the default settings, hardware definitions, and kernel options
# for the 'core' machine family.
# -----------------------------------------------------------------------------
require conf/machine/core.conf


# -----------------------------------------------------------------------------
# MACHINEOVERRIDES: Extend the override list for this machine
# Adding ":core" ensures that any variable using overrides (e.g., foo:core)
# will apply to this machine. This is essential when layering machine-specific
# configurations or kernel fragments.
# -----------------------------------------------------------------------------
MACHINEOVERRIDES =. ":core"


# -----------------------------------------------------------------------------
# Select the preferred kernel provider for this machine
# virtual/kernel is a generic dependency used by the system.
# Setting this ensures that 'linux-core' is chosen as the kernel recipe.
# -----------------------------------------------------------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-core"


# -----------------------------------------------------------------------------
# Ensure the hello-kmodule kernel module is included in the final root filesystem
# MACHINE_ESSENTIAL_EXTRA_RDEPENDS installs packages that are required for the
# machine to boot or operate correctly. Adding the module here guarantees that
# the kernel module is always present on the target image.
# -----------------------------------------------------------------------------
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-hello-kmodule"
